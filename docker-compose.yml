services:
  redis:
    build: ./redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  ollama:
    build: ./ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  jupyter:
    image: jupyter/base-notebook:latest
    container_name: local-jupyter
    ports:
      - "8888:8888"
    volumes:
      - jupyter_data:/home/jovyan/work
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - REDIS_HOST=http://redis:6379
    depends_on:
      - ollama
      - redis
    restart: unless-stopped

volumes:
  ollama_data:
  jupyter_data: